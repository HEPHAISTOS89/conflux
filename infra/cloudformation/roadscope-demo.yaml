AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  RoadScope AI demo API on ECS Fargate with a private S3 data bucket, ECR image,
  CloudWatch logs, ALB health checks, and an optional low-cost AWS Budget.
  This template intentionally uses caller-provided VPC/subnets and public HTTP
  only for a short-lived demo; use HTTPS and private networking for production.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the demo (default VPC is acceptable for a throwaway demo).
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs.
  ImageUri:
    Type: String
    Description: Fully-qualified ECR image URI including tag or digest.
  ContainerPort:
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional email for the monthly budget alert. Leave empty to skip budget resource.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Alert threshold only; it does not cap AWS spending.

Conditions:
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, '']]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDemoObjects
            Status: Enabled
            ExpirationInDays: 14
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep five tagged images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/roadscope-api-${AWS::StackName}
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDemoDataBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub roadscope-api-${AWS::StackName}
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: ROADScope_DATA_BUCKET
              Value: !Ref DataBucket
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${ContainerPort}/health\")'"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP ingress for the demo ALB; replace with HTTPS in production.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow API traffic only from the demo ALB.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref AlbSecurityGroup]
      Type: application
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref EcsCluster
      ServiceName: !Sub roadscope-api-${AWS::StackName}
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref PublicSubnets
      TaskDefinition: !Ref ApiTaskDefinition
      LoadBalancers:
        - ContainerName: api
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref ApiTargetGroup
      Tags:
        - Key: Project
          Value: RoadScopeAI
        - Key: Environment
          Value: demo

  DemoBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub RoadScopeAI-${AWS::StackName}
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL for the demo (use HTTPS behind a certificate for production).
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}
  DataBucketName:
    Value: !Ref DataBucket
  EcrRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  EcsClusterName:
    Value: !Ref EcsCluster
  ApiServiceName:
    Value: !GetAtt ApiService.Name
